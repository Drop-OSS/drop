name: Fmt Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, next ]
  schedule:
    - cron:  '0 23 * * 4'

env:
  RUST_BACKTRACE: full

jobs:
  fmt_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - uses: hustcer/setup-nu@0f8993e49525fffbfd01be38c6ac3ef673a934ba # v3.23
        with:
          version: '0.105.1'
        env:
            GITHUB_TOKEN: ${{ secrets.PAT_GLOBAL }}
      - name: Just version
        run: just --version
      - name: Fmt Check
        run: just fmt_check 