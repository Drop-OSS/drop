services:
  gamedepot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Shown in the UI/update check. Local builds default to a `-local` tag so
        # they never look like a published release.
        BUILD_DROP_VERSION: ${BUILD_DROP_VERSION:-v0.4.0-local}
        BUILD_GIT_REF: ${BUILD_GIT_REF:-local}
    image: gamedepot/server:latest
    container_name: gamedepot-server
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gamedepot}:${POSTGRES_PASSWORD:-gamedepot_secret}@postgres:5432/${POSTGRES_DB:-gamedepot}?schema=public
      - NODE_ENV=production
      - NUXT_TELEMETRY_DISABLED=1
      - LIBRARY=/library
      - DATA=/data
      - PORT=4000
      - EXTERNAL_URL=${EXTERNAL_URL:-http://localhost:4000}
      # 32-byte key (openssl rand -hex 32) that encrypts stored store
      # credentials (OAuth/refresh tokens, tickets, session cookies) at
      # rest. Required: credential writes fail closed without it. Put it in
      # .env (git-ignored); rotating it orphans existing sealed rows.
      - GAMEDEPOT_CREDENTIAL_KEY=${GAMEDEPOT_CREDENTIAL_KEY}
      # EA grants no public OAuth clients. Provide your own registered
      # EA/Origin OAuth client only if you want browser sign-in and automatic
      # token renewal for the EA tab; without these, paste launcher-issued
      # tokens in the admin UI instead.
      # - EA_OAUTH_CLIENT_ID=${EA_OAUTH_CLIENT_ID}
      # - EA_OAUTH_CLIENT_SECRET=${EA_OAUTH_CLIENT_SECRET}
      # - EA_OAUTH_REDIRECT_URI=${EA_OAUTH_REDIRECT_URI}
    volumes:
      - ${GAMEDEPOT_DATA_PATH:-./data}:/data
      - ${GAMEDEPOT_LIBRARY_PATH:-./games}:/library
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: gamedepot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gamedepot}
      POSTGRES_USER: ${POSTGRES_USER:-gamedepot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamedepot_secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-gamedepot} -d ${POSTGRES_DB:-gamedepot}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
