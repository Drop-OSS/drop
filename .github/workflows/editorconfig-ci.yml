name: EditorConfig CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  lint-editorconfig:
    name: EditorConfig Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install editorconfig-checker
        run: npm install -g editorconfig-checker

      # Pre-existing violations in legacy files: tracked in TODO, not blocking
      - name: Validate .editorconfig compliance
        continue-on-error: true
        run: |
          ec --exclude \
            '(node_modules|\.git|\.nuxt|\.output|coverage|dist|target|\.omo|\.dockerignore|README\.md|LICENSE|server/prisma/migrations|sites/docs|sites/promo/public|desktop/libs|backend|desktop/main/(components|pages|layouts|assets|plugins|public))'
