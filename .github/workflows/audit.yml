name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 3 AM UTC

permissions:
  contents: read

jobs:
  pnpm-audit:
    name: pnpm audit (workspace)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --prod

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-image:
    name: Trivy scan (server image)
    runs-on: ubuntu-latest
    # Only meaningful when an image tag exists; skip on first push before any release.
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Build server image locally
        run: docker build -t gamedepot-server:audit ./server

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: gamedepot-server:audit
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
