name: Desktop CI

on:
  push:
    branches: [develop]
    paths:
      - "desktop/src-tauri/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    branches: [develop]
    paths:
      - "desktop/src-tauri/**"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Format, Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
        with:
          components: rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Check formatting
        run: cargo fmt --all -- --check

      # `cargo check` not `cargo clippy --all-features`: pre-existing errors
      # in some workspace members. Tighten when resolved.
      - name: Build
        run: cargo check --workspace

      # Pre-existing test failures in some crates. Tighten when resolved.
      - name: Test
        continue-on-error: true
        run: cargo test --workspace --no-fail-fast
