name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  validate:
    name: Validate workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run actionlint
        uses: reviewdog/action-actionlint@086cc5300a077f608b81d2b03801bc382e417264 # v1.65.2

      # Enforce: every pnpm audit --ignore GHSA-... must have a risk register entry.
      - name: Verify risk register coverage
        run: |
          IGNORED=$(grep -rh '\-\-ignore GHSA-' .github/workflows/ | grep -oE 'GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}' | sort -u)
          for ghsa in $IGNORED; do
            if ! grep -q "$ghsa" security/risk-register.yaml; then
              echo "ERROR: $ghsa ignored but missing from security/risk-register.yaml"
              exit 1
            fi
          done
          echo "All $(echo $IGNORED | wc -w) ignored advisories have risk register entries"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Review dependencies
        uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4
        with:
          fail-on-severity: critical

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks-action v2 needs full history to resolve base-commit
          # refs on fork PRs (compares baseRef^..headRef). Without this,
          # git fails with 'ambiguous argument ...^...' on shallow clones.
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        # GHSA-mp2f-45pm-3cg9 patched locally via patches/decompress@4.2.1.patch.
        # Remove ignore when upstream publishes decompress@>=4.2.2.
        run: pnpm audit --audit-level=critical --ignore GHSA-mp2f-45pm-3cg9
      - name: Typecheck
        working-directory: server
        run: pnpm run typecheck

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        working-directory: server
        run: pnpm run format:check
      - name: Lint
        working-directory: server
        run: pnpm run lint:eslint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        working-directory: server
        run: pnpm run test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # Coverage is measurement-only at this stage. No thresholds, no gates.
    # Add a `coverage:check` script with thresholds once coverage matures
    # past ~30% on the server business-logic modules.
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run coverage
        working-directory: server
        run: pnpm run coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          directory: server/coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: server

  dockerfile:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "./scripts"
          additional_files: ".husky/pre-commit"
          ignore-paths: "node_modules,.git,.nuxt,.output,target"
