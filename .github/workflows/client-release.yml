name: "Build and release desktop"

on:
  workflow_dispatch:
    inputs:
      tagName:
        required: false
        type: string
        description: "tagName to be associated with this release."
  release:
    types: [published]

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-14" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "macos-14" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # for Tauri v1 you could replace this with ubuntu-20.04.
            args: ""
          - platform: "ubuntu-22.04-arm"
            args: "--target aarch64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
        # webkitgtk 4.0 is for Tauri v1 - webkitgtk 4.1 is for Tauri v2.

      - name: Import Apple Developer Certificate
        if: matrix.platform == 'macos-14'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Add build.keychain to the user keychain search list so that codesign
          # (invoked later by tauri-action WITHOUT an explicit --keychain) can
          # resolve the signing identity from it.
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')

          echo "Created keychain"

          curl https://droposs.org/drop.der --output drop.der

          # swiftc libs/appletrust/add-certificate.swift
          # ./add-certificate drop.der
          # rm add-certificate

          # echo "Added certificate to keychain using swift util"

          ## Script is equivalent to:
          sudo security authorizationdb write com.apple.trust-settings.admin allow
          sudo security add-trusted-cert -d -r trustRoot -k build.keychain -p codeSign -u -1 drop.der
          sudo security authorizationdb remove com.apple.trust-settings.admin

          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          echo "Imported certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Verify Certificate
        if: matrix.platform == 'macos-14'
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Drop OSS")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
          echo "Certificate imported. Using identity: $CERT_ID"

      - name: install frontend dependencies
        run: pnpm install # change this to npm, pnpm or bun depending on which one you use.

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Do NOT set APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD here. Doing so
          # makes tauri-action import the cert into its own throwaway keychain and
          # look up the identity by Apple-only name prefixes (e.g.
          # "Developer ID Application:"), which never matches our "Drop OSS" cert
          # and fails with "failed to resolve signing identity". Instead we rely on
          # the build.keychain prepared above and only pass the resolved identity.
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
          NO_STRIP: true
        with:
          releaseId: ${{ github.event.release.id || '' }}
          tagName: ${{ github.event.release.tag_name || inputs.tagName || 'v__VERSION__' }} # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: "Auto-release v__VERSION__"
          releaseBody: "See the assets to download this version and install. This release was created automatically."
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
          projectPath: "./desktop"

  prepare-release-packages:
    needs: publish-tauri
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      release-tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Prepare release package metadata
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tagName }}
        run: |
          set -euo pipefail

          version="$(jq -r '.version' desktop/src-tauri/tauri.conf.json)"
          tag="${RELEASE_TAG:-v${version}}"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]]

          prerelease="$(gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json isPrerelease --jq '.isPrerelease')"
          if [[ "$prerelease" != "true" && "$prerelease" != "false" ]]; then
            echo "GitHub returned an invalid pre-release flag for $tag: $prerelease" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

          deb_name="Drop.Desktop.Client_${version}_amd64.deb"
          arm64_deb_name="Drop.Desktop.Client_${version}_arm64.deb"
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$deb_name" \
            --pattern "$arm64_deb_name" \
            --dir "$RUNNER_TEMP"

          node packages/update-release-packages.mjs "$tag" "$version" \
            "$RUNNER_TEMP/$deb_name" "$RUNNER_TEMP/$arm64_deb_name"

      - name: Upload prepared package metadata
        uses: actions/upload-artifact@v7
        with:
          name: prepared-release-packages
          path: |
            packages/drop-oss-app/PKGBUILD
            packages/drop-oss-app/.SRCINFO
            packages/drop-oss-app-bin/PKGBUILD
            packages/drop-oss-app-bin/.SRCINFO
            packages/flatpak/org.droposs.client.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  publish-aur:
    needs: prepare-release-packages
    if: needs.prepare-release-packages.outputs.prerelease == 'false'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Download prepared package metadata
        uses: actions/download-artifact@v8
        with:
          name: prepared-release-packages
          path: packages

      - name: Publish AUR packages
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ needs.prepare-release-packages.outputs.version }}
        run: |
          set -euo pipefail

          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "AUR_SSH_PRIVATE_KEY is required to publish the AUR packages." >&2
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          ssh-keyscan -H aur.archlinux.org >> "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          ssh-add "$HOME/.ssh/aur"

          for package in drop-oss-app-bin drop-oss-app; do
            package_dir="$RUNNER_TEMP/$package"
            git clone "ssh://aur@aur.archlinux.org/$package.git" "$package_dir"
            cp "packages/$package/PKGBUILD" "$package_dir/PKGBUILD"
            cp "packages/$package/.SRCINFO" "$package_dir/.SRCINFO"
            git -C "$package_dir" config user.name "github-actions[bot]"
            git -C "$package_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$package_dir" add PKGBUILD .SRCINFO
            if ! git -C "$package_dir" diff --cached --quiet; then
              git -C "$package_dir" commit -m "Update to $RELEASE_VERSION"
              git -C "$package_dir" push origin HEAD:master
            fi
          done

  publish-arch:
    needs: prepare-release-packages
    runs-on: ubuntu-24.04
    container: archlinux:base
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - name: Install Arch packaging tools
        run: pacman -Syu --noconfirm --needed base-devel git libarchive github-cli

      - uses: actions/checkout@v7

      - name: Download prepared package metadata
        uses: actions/download-artifact@v8
        with:
          name: prepared-release-packages
          path: packages

      - name: Build Arch package
        working-directory: packages/drop-oss-app-bin
        run: |
          set -euo pipefail

          useradd --create-home builder
          chown -R builder:builder .
          # Repackage the prebuilt Debian binary without installing its runtime dependencies.
          runuser -u builder -- makepkg --nodeps --noconfirm

      - name: Upload Arch package
        working-directory: packages/drop-oss-app-bin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release-packages.outputs.release-tag }}
        run: |
          set -euo pipefail

          package_list="$(runuser -u builder -- makepkg --packagelist)"
          mapfile -t packages <<< "$package_list"
          if [[ "${#packages[@]}" -ne 1 || ! -f "${packages[0]}" ]]; then
            echo "Expected one built Arch package, found: $package_list" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${packages[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish-flatpak:
    needs: prepare-release-packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            arch: x86_64
          - platform: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download prepared package metadata
        uses: actions/download-artifact@v8
        with:
          name: prepared-release-packages
          path: packages

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub and install build dependencies
        env:
          FLATPAK_ARCH: ${{ matrix.arch }}
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --arch="$FLATPAK_ARCH" \
            flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Build and upload Flatpak bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release-packages.outputs.release-tag }}
          RELEASE_VERSION: ${{ needs.prepare-release-packages.outputs.version }}
          FLATPAK_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          repo="$RUNNER_TEMP/flatpak-repo"
          build_dir="$RUNNER_TEMP/flatpak-build"
          bundle="$RUNNER_TEMP/Drop.Desktop.Client_${RELEASE_VERSION}_${FLATPAK_ARCH}.flatpak"
          flatpak-builder --user --force-clean --arch="$FLATPAK_ARCH" --repo="$repo" \
            "$build_dir" packages/flatpak/org.droposs.client.json
          flatpak build-bundle \
            --arch="$FLATPAK_ARCH" \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            "$repo" "$bundle" org.droposs.client master

          gh release upload "$RELEASE_TAG" "$bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
