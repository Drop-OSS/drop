name: CLI CI

on:
  push:
    branches: [develop]
    paths:
      - "cli/**"
      - ".github/workflows/cli-ci.yml"
  pull_request:
    branches: [develop]
    paths:
      - "cli/**"
      - ".github/workflows/cli-ci.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Build, Test, Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: "./cli -> target"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        # `--all-targets` includes tests since lib.rs was added.
        # `--no-deps` to avoid linting transitive deps (unmaintained crates).
        # Pre-existing warnings not escalated to errors; fix incrementally.
        run: cargo clippy --all-targets --no-deps --all-features

      - name: Run tests
        run: cargo test --all-features --all --verbose

      # Advisory until noise rate is low. Tighten to blocking after triage.
      - name: Audit dependencies
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit
