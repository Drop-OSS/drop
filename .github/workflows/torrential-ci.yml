name: Torrential CI

on:
  push:
    branches: [develop]
    paths:
      - "torrential/**"
      - "libraries/droplet/**"
      - "libraries/droplet_types/**"
      - "libraries/libarchive/**"
      - ".github/workflows/torrential-ci.yml"
  pull_request:
    branches: [develop]
    paths:
      - "torrential/**"
      - "libraries/droplet/**"
      - "libraries/droplet_types/**"
      - "libraries/libarchive/**"
      - ".github/workflows/torrential-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: torrential
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # dtolnay/rust-toolchain@nightly

      - name: Rust cache
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # swatinem/rust-cache@v2
        with:
          workspaces: "./torrential -> target"

      # Required by the droplet-rs path dependency (libarchive bindings).
      - name: Install libarchive
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev

      - name: Build
        run: cargo build --all-targets --verbose

      - name: Run tests
        run: cargo test --verbose
