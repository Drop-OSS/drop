# SonarCloud project — BillyOutlast / drop (main monolith)
sonar.projectKey=BillyOutlast_drop
sonar.organization=billyoutlast
sonar.projectName=BillyOutlast / drop
sonar.projectVersion=1.0

# Enable in-code issue resolution (SONAR-RESOLVE)
sonar.issues.issueResolution.enabled=true

# Fail CI on quality gate failure
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

# Paths
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/target/**,**/coverage/**,**/__pycache__/**,**/.venv/**,**/*.d.ts,**/migrations/**,**/.nuxt/**,**/.output/**,**/test/**,**/tests/**

# Files outside vitest coverage scope (Swift, Go, Prisma singleton).
# Excluded from coverage analysis only — still scanned for issues.
sonar.coverage.exclusions=**/*.swift,**/backend/**,**/server/server/internal/db/database.ts
sonar.newCode.exclusions=desktop/libs/appletrust/**,**/backend/**,**/server/server/internal/db/database.ts

# JavaScript / TypeScript / Vue
sonar.javascript.file.suffixes=.js,.jsx,.cjs,.mjs,.vue
sonar.typescript.file.suffixes=.ts,.tsx
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info

# Rust native addons
sonar.rust.file.suffixes=.rs

# Python utility scripts
sonar.python.file.suffixes=.py

# Source encoding
sonar.sourceEncoding=UTF-8
