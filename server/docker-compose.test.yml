services:
  postgres-test:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: drop_test
      POSTGRES_USER: drop_test
      POSTGRES_PASSWORD: drop_test
    ports:
      - "5433:5432"
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drop_test"]
      interval: 5s
      timeout: 5s
      retries: 5
