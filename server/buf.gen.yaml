version: v2
plugins:
  - local: protoc-gen-es
    out: server/internal/proto
    opt: target=ts

inputs:
  # Scope the scan to the vendored proto trees: a full-root walk trips over
  # runtime data/ directories that exist only on developer hosts.
  - directory: ../
    paths:
      - ../torrential
      - ../ubisoft-demux
