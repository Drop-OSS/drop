services:
  postgres:
    # using alpine image to reduce image size
    image: postgres:alpine
    healthcheck:
      test: pg_isready -d drop -U drop
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 10s
    volumes:
      - ./db:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=drop
      - POSTGRES_USER=drop
      - POSTGRES_DB=drop
  drop:
    image: ghcr.io/drop-oss/drop:nightly
    stdin_open: true
    tty: true
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 3000:3000
    volumes:
      - ./library:/library
      - ./data:/data
    environment:
      - DATABASE_URL=postgres://drop:drop@postgres:5432/drop
      # Limit Node.js heap to prevent uncontrolled memory growth
      # Adjust based on your mem_limit: roughly 60-70% of container mem_limit
      - NODE_OPTIONS=--max-old-space-size=8192
    # Memory limits to prevent OOM during large file imports
    # For large compressed games, use higher limits or enable swap
    # Options:
    # - Smaller deployments: mem_limit: 4g, memswap_limit: 5g
    # - Medium deployments: mem_limit: 8g, memswap_limit: 10g  
    # - Large deployments: mem_limit: 16g, memswap_limit: 20g
    # Set to 60-70% of available system RAM (leave room for host OS)
    mem_limit: 12g
    memswap_limit: 16g
    # CPU limit: Set to 50-75% of your CPU cores (e.g., "4.0" for 8-core system)
    cpus: "6.0"
    # System resource limits to prevent "WouldBlock" errors when spawning processes
    # These allow the container to create enough file descriptors and processes
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 4096
        hard: 4096
