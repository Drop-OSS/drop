[package]
name = "importer"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "*"
gethostname = "1.0.1"
hex = "0.4.3"
log = "0.4.28"
rayon = "1.11.0"
remote = { path = "../remote", version = "0.1.0" }
reqwest = { version = "0.12.28", default-features = false, features = [
  "http2",
  "json",
  "rustls-tls",
  "rustls-tls-native-roots",
  "stream",
] }
reqwest-middleware = { version = "0.4.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "*", features = ["rt", "sync", "fs", "io-util", "macros"] }
walkdir = "2.5.0"
